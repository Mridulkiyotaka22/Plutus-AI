name: Expand PLUTUS source archive

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  expand-source:
    if: github.event.head_commit.message == 'Upload complete PLUTUS source archive'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true

      - name: Expand complete project into repository
        shell: bash
        run: |
          set -euo pipefail
          archive="plutus-ai-source.tar.xz"
          test -f "$archive"
          temp_dir="$(mktemp -d)"
          tar -xJf "$archive" -C "$temp_dir"
          cp -a "$temp_dir/." .
          rm -f "$archive"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No project files changed after extraction."
            exit 0
          fi
          git commit -m "Add complete PLUTUS AI Flutter and Django source"
          git push